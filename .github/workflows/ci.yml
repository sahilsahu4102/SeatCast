name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt ruff==0.17.6
      - run: ruff check src tests
      - run: pytest -q
      - name: No data files or vehicle plates in the repo
        run: |
          if git ls-files | grep -E '^data/'; then echo "::error::data files are committed"; exit 1; fi
          if git grep -nE 'DL ?[0-9]{1,2} ?[A-Z]{1,3} ?[0-9]{4}'; then echo "::error::possible vehicle plate in a tracked file"; exit 1; fi

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
