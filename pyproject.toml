[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seatcast"
version = "0.1.0"
description = "Crowding-aware bus journey planner for Delhi"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # real bugs only; style is CLAUDE.md §2 rule 8
ignore = ["E741", "E731"]         # short names like l and one-line lambdas are house style

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
