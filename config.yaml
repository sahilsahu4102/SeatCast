# SeatCast settings. Every assumption is labelled; [Rn] = CLAUDE.md §15, D-nn = docs/THINKING.md.
tz: Asia/Kolkata
slot_min: 30
daytypes: {weekday: [0, 1, 2, 3, 4], saturday: [5], sunday: [6]}   # Python weekday(), Mon = 0
holidays: ["2026-10-02", "2026-10-20"]          # Gandhi Jayanti; Dussehra (gazetted). D-04. Step 7 flags other anomaly days itself.
anomaly_dev: 0.3                                 # flag a date if |pax / same-weekday median - 1| > this (CLAUDE.md §4.3 step 7)
